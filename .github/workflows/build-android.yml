name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # ← Manual trigger button from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: mobile_app/package-lock.json

    - name: Install npm dependencies
      working-directory: mobile_app
      run: npm install

    - name: Sync Capacitor Android
      working-directory: mobile_app
      run: npx cap sync android

    - name: Make Gradlew Executable
      working-directory: mobile_app/android
      run: chmod +x ./gradlew

    - name: Build Android Debug APK
      working-directory: mobile_app/android
      run: ./gradlew assembleDebug --stacktrace

    - name: Copy & Rename APK
      run: |
        mkdir -p build_output
        cp mobile_app/android/app/build/outputs/apk/debug/app-debug.apk build_output/StealthChessHelper.apk
        echo "✅ APK Build Complete:"
        ls -lh build_output/StealthChessHelper.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: StealthChessHelper-Android-APK
        path: build_output/StealthChessHelper.apk
        retention-days: 90

    - name: Attach APK to GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      with:
        tag_name: v1.2.0
        name: "Stealth Chess Helper v1.2.0"
        files: build_output/StealthChessHelper.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
