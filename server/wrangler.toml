# Stealth Chess Helper — Cloudflare Worker config (FREE tier)
# Docs: https://developers.cloudflare.com/workers/

name = "stealth-chess-license-server"
main = "worker.js"
compatibility_date = "2025-01-01"

# KV namespace for the license ledger (create with: npx wrangler kv namespace create LEDGER)
# Then paste the returned id below.
[[kv_namespaces]]
binding = "LEDGER"
id = "4ac45dddd29f4818b4a4413ce1e94c8a"

# Free plan allows 100,000 requests/day — more than enough.
[vars]
MAX_ACTIVATIONS_PER_KEY = "1"
