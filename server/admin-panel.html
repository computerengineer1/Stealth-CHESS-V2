<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stealth Chess — Owner Control Panel</title>
<style>
:root{--bg:#0b0e14;--card:#141a26;--acc:#22c55e;--txt:#e6edf3;--mut:#8b98a9;--red:#ef4444}
*{box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);min-height:100vh;padding:24px}
h1{font-size:20px;margin-bottom:4px} .sub{color:var(--mut);font-size:13px;margin-bottom:20px}
.card{background:var(--card);border:1px solid #232d3f;border-radius:14px;padding:18px;margin-bottom:16px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #2a3648;background:#0f1420;color:var(--txt);font-size:14px}
button{margin-top:14px;padding:10px 18px;border:none;border-radius:8px;background:var(--acc);color:#04120a;font-weight:700;cursor:pointer;font-size:14px}
button.red{background:var(--red);color:#fff}
.row{display:flex;gap:10px}.row>*{flex:1}
pre{background:#0a0f18;border-radius:8px;padding:12px;font-size:12px;overflow:auto;margin-top:10px;white-space:pre-wrap;word-break:break-all}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
th,td{padding:6px 8px;border-bottom:1px solid #232d3f;text-align:left}
.ok{color:var(--acc)}.bad{color:var(--red)}
</style>
</head>
<body>
<h1>🎮 Stealth Chess Helper — لوحة تحكم المالك</h1>
<div class="sub">Owner-only control panel • generate / revoke / unbind keys • keep this file private</div>

<div class="card">
<label>رابط الخادم (Worker URL)</label>
<input id="api" placeholder="https://xxxx.workers.dev">
<label>ADMIN_TOKEN (السر الخاص بك فقط)</label>
<input id="tok" type="password" placeholder="the secret you set with wrangler secret put ADMIN_TOKEN">
</div>

<div class="card">
<b>➕ توليد مفتاح جديد</b>
<div class="row">
<div><label>الفئة</label><select id="tier"><option value="MON">شهري Monthly</option><option value="TRM">3 شهور</option><option value="LFT">مدى الحياة Lifetime</option><option value="TRL">تجريبي Trial</option></select></div>
<div><label>عدد الأيام</label><input id="days" value="30"></div>
<div><label>HWID جهاز العميل (اختياري للربط المسبق)</label><input id="hwid" placeholder="اتركه فارغاً ليُربط تلقائياً عند أول تشغيل"></div>
</div>
<div><label>اسم/ملاحظة العميل</label><input id="label" placeholder="مثال: Ali - WhatsApp order"></div>
<button onclick="issue()">توليد المفتاح</button>
<pre id="out-issue" hidden></pre>
</div>

<div class="card">
<b>🔌 إدارة المفاتيح</b>
<div class="row">
<div><label>معرّف المفتاح (Key ID)</label><input id="kid" placeholder="10-character key id from the list"></div>
</div>
<button class="red" onclick="act('revoke')">إلغاء المفتاح فوراً (Revoke)</button>
<button onclick="act('unbind')" style="background:#eab308;color:#241b02">فك ربط الجهاز (Unbind)</button>
<pre id="out-admin" hidden></pre>
</div>

<div class="card">
<b>📋 قائمة كل المفاتيح</b>
<button onclick="list()" style="background:#3b82f6;color:#fff">تحديث القائمة</button>
<div id="tbl"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const hdrs=()=>({'Content-Type':'application/json','X-Admin-Token':$('tok').value.trim()});
const base=()=>$('api').value.trim().replace(/\/+$/,'');
async function post(p,b){const r=await fetch(base()+p,{method:'POST',headers:hdrs(),body:JSON.stringify(b)});return r.json();}
function show(id,obj){const e=$(id);e.hidden=false;e.textContent=JSON.stringify(obj,null,2);}
async function issue(){
 const b={tier:$('tier').value,days:+$('days').value||30,label:$('label').value};
 if($('hwid').value.trim())b.hwid=$('hwid').value.trim();
 const r=await post('/admin/issue',b);show('out-issue',r);
 if(r.ok){navigator.clipboard&&navigator.clipboard.writeText(r.key.token);alert('✅ تم نسخ المفتاح تلقائياً!\n'+r.key.token);}
}
async function act(a){const r=await post('/admin/'+a,{key:$('kid').value.trim()});show('out-admin',r);}
async function list(){
 const r=await fetch(base()+'/admin/list',{headers:hdrs()}).then(x=>x.json());
 if(!r.ok){$('tbl').innerHTML='<pre class="bad">'+JSON.stringify(r)+'</pre>';return;}
 let h='<table><tr><th>ID</th><th>Tier</th><th>Expiry</th><th>Device HWID</th><th>Status</th><th>Label</th><th>Key</th></tr>';
 for(const k of r.keys){h+='<tr><td>'+k.id+'</td><td>'+k.tier_name+'</td><td>'+k.expiry+'</td><td>'+(k.hwid||'<span class=mut>not bound</span>')+'</td><td class="'+(k.revoked?'bad">REVOKED':'ok">active')+'</td><td>'+(k.label||'')+'</td><td><code>'+k.token.slice(0,14)+'…</code></td></tr>';}
 $('tbl').innerHTML=h+'</table>';
}
// remember api+token locally
$('api').value=localStorage.api||'';$('tok').value=localStorage.tok||'';
$('api').onchange=()=>localStorage.api=$('api').value;$('tok').onchange=()=>localStorage.tok=$('tok').value;
</script>
</body>
</html>
